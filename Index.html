<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montador Pro - Gestão de Montagens</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        :root{--cinza-escuro:#2C2C2C;--branco:#FFFFFF;--cinza-claro:#F0F0F0;--destaque:#4A90E2}
        body{background:var(--cinza-escuro);color:var(--branco);min-height:100vh}
        .container{max-width:480px;margin:0 auto;padding:20px}
        header{text-align:center;padding:20px 0;border-bottom:1px solid #444;margin-bottom:20px}
        .logo{font-size:28px;font-weight:bold;margin-bottom:5px}
        .dev{font-size:12px;color:#AAA;margin-top:5px}
        nav{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
        .btn{background:var(--branco);color:var(--cinza-escuro);border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
        .btn:hover{background:#E0E0E0}
        .card{background:#3A3A3A;padding:16px;border-radius:10px;margin-bottom:12px}
        input{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px;background:#4A4A4A;color:#FFF;font-size:15px}
        label{font-size:14px;color:#DDD}
        .total-comissao{background:#2E7D32;padding:15px;border-radius:10px;text-align:center;font-size:20px;font-weight:bold;margin-top:10px}
        .secao{display:none}
        .secao.ativa{display:block}
        .grupo-botoes{display:flex;gap:10px;margin-top:15px}
        .btn-azul{background:var(--destaque);color:#FFF}
        .btn-vermelho{background:#D32F2F;color:#FFF}
        .item-lista{background:#444;padding:10px;border-radius:6px;margin:6px 0;font-size:14px}
        textarea{width:100%;padding:10px;margin:6px 0;border-radius:6px;background:#4A4A4A;color:#FFF;border:none;min-height:80px}
        .voltar{background:#555;color:#FFF;margin-bottom:15px}
    </style>
</head>
<body>
    <div class="container">
        <!-- PÁGINA INICIAL -->
        <header>
            <div class="logo">🔧 Montador Pro</div>
            <div class="dev">Desenvolvido por Jefferson Lorenzeto Software Solutions</div>
        </header>

        <nav id="menuPrincipal">
            <button class="btn" onclick="mostrarSecao('montagens')">📋 Gerenciar Montagens do Mês</button>
            <button class="btn" onclick="mostrarSecao('assistencia')">🛠️ Abrir Assistência Técnica</button>
            <button class="btn" onclick="gerarRelatorio()">📤 Gerar e Enviar Relatório</button>
        </nav>

        <!-- SEÇÃO MONTAGENS -->
        <div id="montagens" class="secao">
            <button class="btn voltar" onclick="mostrarSecao('menu')">← Voltar</button>
            <div class="card">
                <h3>➕ Adicionar Projeto</h3>
                <label>Cliente:</label>
                <input type="text" id="cliente" placeholder="Nome do Cliente">
                
                <label>Código / Ambiente:</label>
                <input type="text" id="codigoProjeto" placeholder="Ex: 1ANSERVE648394J - Lavanderia">
                
                <label>Valor do Projeto (R$):</label>
                <input type="number" id="valorProjeto" placeholder="0,00" oninput="calcularComissao()">
                
                <label>Comissão (1,2%):</label>
                <input type="text" id="comissaoCalc" readonly placeholder="R$ 0,00">
                
                <button class="btn" onclick="adicionarProjeto()" style="margin-top:10px">✅ Salvar Projeto</button>
            </div>

            <div class="card">
                <h3>📊 Projetos do Mês</h3>
                <div id="listaProjetos"></div>
                <div class="total-comissao">
                    Total Comissão: <span id="totalComissao">R$ 0,00</span>
                </div>
            </div>
        </div>

        <!-- SEÇÃO ASSISTÊNCIA TÉCNICA -->
        <div id="assistencia" class="secao">
            <button class="btn voltar" onclick="mostrarSecao('menu')">← Voltar</button>
            <div class="card">
                <h3>📝 Solicitação de Recurso para Montagem</h3>
                <label>Cliente:</label>
                <input type="text" id="atCliente" placeholder="Nome Completo">

                <label>Código do Item:</label>
                <input type="text" id="atCodigo" placeholder="Ex: 1ANSERVE648394J">

                <label>Ambiente:</label>
                <input type="text" id="atAmbiente" placeholder="Ex: Lavanderia">

                <h4 style="margin:12px 0 6px">Detalhamento do Problema</h4>
                <label>Situação:</label>
                <textarea id="atSituacao" placeholder="Descreva a situação..."></textarea>

                <label>Motivo:</label>
                <input type="text" id="atMotivo" placeholder="Ex: Erro de usinagem">

                <label>Acabamento:</label>
                <input type="text" id="atAcabamento" placeholder="Ex: Branco Tx.">

                <label>Medidas:</label>
                <input type="text" id="atMedidas" placeholder="Ex: Conforme projeto">

                <label>Recurso Necessário:</label>
                <textarea id="atRecurso" placeholder="Ex: Troca do tampo..."></textarea>

                <button class="btn btn-azul" onclick="enviarWhatsApp()" style="margin-top:10px">📱 Enviar pelo WhatsApp</button>
            </div>
        </div>
    </div>

<script>
let projetos = [];

// Alternar telas
function mostrarSecao(id) {
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    if(id === 'menu') {
        document.getElementById('menuPrincipal').style.display = 'flex';
    } else {
        document.getElementById('menuPrincipal').style.display = 'none';
        document.getElementById(id).classList.add('ativa');
    }
}

// Calcular comissão automaticamente
function calcularComissao() {
    const valor = parseFloat(document.getElementById('valorProjeto').value) || 0;
    const comissao = valor * 0.012;
    document.getElementById('comissaoCalc').value = 'R$ ' + comissao.toFixed(2).replace('.', ',');
}

// Adicionar projeto na lista
function adicionarProjeto() {
    const cliente = document.getElementById('cliente').value.trim();
    const codigo = document.getElementById('codigoProjeto').value.trim();
    const valor = parseFloat(document.getElementById('valorProjeto').value) || 0;
    const comissao = valor * 0.012;

    if(!cliente || valor <= 0) { alert('Preencha o nome do cliente e o valor!'); return; }

    projetos.push({cliente, codigo, valor, comissao});
    salvarDados();
    atualizarLista();
    
    // Limpar campos
    document.getElementById('cliente').value = '';
    document.getElementById('codigoProjeto').value = '';
    document.getElementById('valorProjeto').value = '';
    document.getElementById('comissaoCalc').value = '';
    alert('✅ Projeto salvo!');
}

// Atualizar lista e total
function atualizarLista() {
    const lista = document.getElementById('listaProjetos');
    lista.innerHTML = '';
    let total = 0;

    projetos.forEach((p, i) => {
        total += p.comissao;
        lista.innerHTML += `
        <div class="item-lista">
            <strong>${p.cliente}</strong><br>
            ${p.codigo}<br>
            Valor: R$ ${p.valor.toFixed(2).replace('.', ',')} | Comissão: R$ ${p.comissao.toFixed(2).replace('.', ',')}
        </div>`;
    });

    document.getElementById('totalComissao').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
}

// Gerar texto da assistência e enviar WhatsApp
function enviarWhatsApp() {
    const texto = `*SOLICITAÇÃO DE RECURSO PARA MONTAGEM*

*Cliente:* ${document.getElementById('atCliente').value}
*Código do Item:* ${document.getElementById('atCodigo').value}
*Ambiente:* ${document.getElementById('atAmbiente').value}

*DETALHAMENTO DO PROBLEMA:*
*Situação:* ${document.getElementById('atSituacao').value}
*Motivo:* ${document.getElementById('atMotivo').value}
*Acabamento:* ${document.getElementById('atAcabamento').value}
*Medidas:* ${document.getElementById('atMedidas').value}

*INFORMAÇÕES DE SERVIÇO:*
*Recurso Necessário:* ${document.getElementById('atRecurso').value}

Desenvolvido por Jefferson Lorenzeto Software Solutions`;

    const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
}

// Salvar e carregar dados (fica salvo no celular)
function salvarDados() {
    localStorage.setItem('montadorProjetos', JSON.stringify(projetos));
}
function carregarDados() {
    const salvo = localStorage.getItem('montadorProjetos');
    if(salvo) projetos = JSON.parse(salvo);
    atualizarLista();
}

// Relatório geral
function gerarRelatorio() {
    if(projetos.length === 0) { alert('Adicione projetos primeiro!'); return; }
    let totalGeral = projetos.reduce((s,p)=>s+p.comissao,0);
    let texto = `*RELATÓRIO DE MONTAGENS - MÊS ATUAL*

`;
    projetos.forEach(p => {
        texto += `Cliente: ${p.cliente}
Projeto: ${p.codigo}
Valor: R$ ${p.valor.toFixed(2).replace('.', ',')}
Comissão: R$ ${p.comissao.toFixed(2).replace('.', ',')}
---
`;
    });
    texto += `
*TOTAL DE COMISSÃO: R$ ${totalGeral.toFixed(2).replace('.', ',')}*

Desenvolvido por Jefferson Lorenzeto Software Solutions`;

    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

// Carregar ao abrir
carregarDados();
</script>
</body>
</html>
