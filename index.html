<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#D9793B" />
<meta name="description" content="Portal do Condomínio Ed. Democrata" />
<title>Ed. Democrata</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    /* Paleta escura inspirada no design system enviado:
       superfícies em cinza-ardósia, laranja como cor primária,
       bordas finas e "elevação" suave nos cards. */
    --cream:#20242A;        /* base surface (fundo da página) */
    --card:#2E333B;         /* raised surface (cards, topo, abas) */
    --card2:#262A31;        /* inset surface (chips de ícone, campos) */
    --line:#3D434C;         /* bordas */
    --terracotta:#D9793B;   /* laranja primário */
    --terracottaDark:#B8622A;
    --green:#4FAE7C;
    --greenDark:#3B8F63;
    --brown:#F1F3F5;        /* texto principal (claro) */
    --brownSoft:#98A0AA;    /* texto secundário */
    --red:#E4585B;
    --redSoft:rgba(228,88,91,.16);
    --greenSoft:rgba(79,174,124,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--brown);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3,.serif{font-family:inherit;font-weight:800;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .max{max-width:420px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    transition:transform .12s ease,box-shadow .12s ease;}
  .card:active{transform:scale(0.97);box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .btn{width:100%;color:#fff;font-weight:600;font-size:14px;padding:11px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);}
  .btn:active{opacity:.85;transform:scale(0.98);}
  .input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--card2);color:var(--brown);}
  .input:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(217,121,63,.25);}
  .label{color:var(--brownSoft);font-size:11px;font-weight:700;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .soft{color:var(--brownSoft);}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tab{flex:1;font-size:12px;font-weight:600;padding:8px 6px;border-radius:10px;white-space:nowrap;}
  .tabs{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;overflow-x:auto;margin-bottom:14px;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:10;}
  .content{flex:1;width:100%;padding:16px;padding-bottom:32px;}
  .day{aspect-ratio:1;border-radius:8px;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .weekday{color:var(--brownSoft);font-size:10px;font-weight:600;text-align:center;padding:4px 0;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .legend-dot{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:6px;}
  ::selection{background:rgba(217,121,63,.35);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =========================================================
   FIREBASE — cole aqui a configuração do SEU projeto
   (Console Firebase → Configurações → Seus apps → SDK)
   Isso NÃO é segredo — a segurança fica nas Regras do Firestore.
========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI",
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

async function getData(key, fallback) {
  try {
    const snap = await getDoc(doc(db, "condominio", key));
    return snap.exists() ? snap.data().value : fallback;
  } catch (e) {
    console.error("Erro lendo", key, e);
    return fallback;
  }
}
async function setData(key, value) {
  await setDoc(doc(db, "condominio", key), { value, updatedAt: Date.now() });
}
// Sobe um arquivo (boleto ou foto de ocorrência) pro Firebase Storage e
// devolve o link de download.
async function uploadFile(path, file) {
  const fileRef = ref(storage, path);
  await uploadBytes(fileRef, file);
  return await getDownloadURL(fileRef);
}

/* =========================================================
   DADOS / CONSTANTES
========================================================= */
const FLOORS = [1, 2, 3, 4, 5];
const UNITS = [1, 2, 3, 4];
const APTOS = FLOORS.flatMap(f => UNITS.map(u => `${f}0${u}`));
const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const WEEKDAYS = ["D","S","T","Q","Q","S","S"];

// Cada morador agora tem senha própria + e-mail. "senha" começa igual ao
// número do apto e "senhaDefinida:false" força a troca no primeiro acesso.
const DEFAULT_RESIDENTS = Object.fromEntries(
  APTOS.map(a => [a, { senha: a, email: "", senhaDefinida: false }])
);
const DEFAULT_ADMINS = { sindico: "sindico123", subsindico: "subsindico123" };
const DEFAULT_REGULAMENTO =
`REGULAMENTO INTERNO — CONDOMÍNIO ED. DEMOCRATA

1. Horário de silêncio: 22h às 8h.
2. Área de lazer: reservas pelo aplicativo, com até 30 dias de antecedência.
3. É proibido uso de área comum por terceiros sem acompanhamento do morador.
4. Animais de estimação devem ser conduzidos com guia nas áreas comuns.
5. O síndico pode atualizar este regulamento a qualquer momento pelo painel administrativo.`;

const money = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");
const dateKey = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
function todayKey(){ const t=new Date(); return dateKey(t.getFullYear(),t.getMonth(),t.getDate()); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* =========================================================
   ESTADO
========================================================= */
let state = {
  booting: true,
  session: null,
  screen: "home",
  residents: DEFAULT_RESIDENTS,
  admins: DEFAULT_ADMINS,
  reservations: {},
  announcements: [],
  fees: { mesReferencia: "Agosto/2026", valores: {} },
  contas: [],
  regulamento: DEFAULT_REGULAMENTO,
  assembleias: [],
  boletos: {},
  ocorrencias: [],
  loginMode: "morador",
  loginError: "",
  pendingApto: null,
  cadastroError: "",
  cal: (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })(),
  selectedDay: null,
  adminTab: "taxas",
  boletoFiltroMes: "todos",
  painelBoletoApto: APTOS[0],
  ocorrenciaEnviada: false,
  busy: false,
  savedTick: "",
};

async function loadAll() {
  const [residents, admins, reservations, announcements, fees, contas, regulamento, assembleias, boletos, ocorrencias] = await Promise.all([
    getData("residents", DEFAULT_RESIDENTS),
    getData("admins", DEFAULT_ADMINS),
    getData("reservations", {}),
    getData("announcements", []),
    getData("fees", { mesReferencia: "Agosto/2026", valores: {} }),
    getData("contas", []),
    getData("regulamento", DEFAULT_REGULAMENTO),
    getData("assembleias", []),
    getData("boletos", {}),
    getData("ocorrencias", []),
  ]);
  Object.assign(state, { residents, admins, reservations, announcements, fees, contas, regulamento, assembleias, boletos, ocorrencias, booting: false });
  render();
}
loadAll();

/* =========================================================
   ÍCONE (traço simplificado do logo)
========================================================= */
const SNAIL_SVG = (size=34) => `
<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
  <path d="M10 70 C10 40 35 20 55 20 C75 20 88 35 88 52 C88 66 78 75 66 75 C56 75 50 68 50 60 C50 53 55 48 61 48"
    stroke="#D9793B" stroke-width="7" stroke-linecap="round"/>
  <path d="M10 70 C25 78 70 80 88 68" stroke="#D9793B" stroke-width="7" stroke-linecap="round"/>
  <path d="M6 22 C10 14 20 10 30 14" stroke="#4FAE7C" stroke-width="7" stroke-linecap="round"/>
  <path d="M30 78 C40 84 46 92 44 98" stroke="#4FAE7C" stroke-width="7" stroke-linecap="round"/>
</svg>`;

/* =========================================================
   RENDER
========================================================= */
function render() {
  const app = document.getElementById("app");
  if (state.booting) {
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <div class="spin" style="width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--terracotta);border-radius:50%;"></div>
    </div>`;
    return;
  }
  if (!state.session) {
    if (state.pendingApto) {
      app.innerHTML = renderDefinirSenha();
      wireDefinirSenha();
      return;
    }
    app.innerHTML = renderLogin();
    wireLogin();
    return;
  }
  app.innerHTML = `
    <div class="topbar"><div class="max" style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
      <button data-action="home" style="display:flex;align-items:center;gap:8px;">
        ${SNAIL_SVG(30)}
        <div style="text-align:left;line-height:1.1;">
          <div class="serif" style="font-weight:700;font-size:15px;">Ed. Democrata</div>
          <div class="soft" style="font-size:11px;">${state.session.type==="admin" ? "Painel: "+esc(state.session.user) : "Apto "+esc(state.session.apto)}</div>
        </div>
      </button>
      <button data-action="logout" class="soft" style="font-size:12px;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;">Sair</button>
    </div></div>
    <div class="content max">${renderScreen()}</div>
  `;
  wireApp();
}

function renderLogin() {
  const opts = APTOS.map(a => `<option value="${a}" ${state._apto===a?"selected":""}>${a}</option>`).join("");
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
    <div style="margin-bottom:28px;display:flex;flex-direction:column;align-items:center;">
      ${SNAIL_SVG(64)}
      <h1 class="serif" style="font-size:22px;font-weight:700;margin:10px 0 2px;">Ed. Democrata</h1>
      <p class="soft" style="font-size:13px;margin:0;">Portal do condomínio</p>
    </div>
    <div class="card" style="width:100%;max-width:340px;">
      <div class="tabs" style="margin-bottom:16px;">
        <button data-action="login-mode" data-mode="morador" class="tab" style="${state.loginMode==='morador'?'background:var(--terracotta);color:#fff;':'color:var(--brownSoft);'}">Morador</button>
        <button data-action="login-mode" data-mode="admin" class="tab" style="${state.loginMode==='admin'?'background:var(--terracotta);color:#fff;':'color:var(--brownSoft);'}">Síndico</button>
      </div>
      <form id="login-form">
        ${state.loginMode==="morador" ? `
          <label class="label">Apartamento</label>
          <select id="f-apto" class="input" style="margin-bottom:10px;">
            <option value="">Selecione seu apto</option>${opts}
          </select>
        ` : `
          <label class="label">Usuário</label>
          <select id="f-user" class="input" style="margin-bottom:10px;">
            <option value="sindico">Síndico</option>
            <option value="subsindico">Subsíndico</option>
          </select>
        `}
        <label class="label">Senha</label>
        <input id="f-senha" type="password" class="input" placeholder="••••••" style="margin-bottom:10px;" />
        ${state.loginError ? `<p style="color:var(--red);font-size:12px;margin:0 0 8px;">${esc(state.loginError)}</p>` : ""}
        <button type="submit" class="btn" style="background:var(--terracotta);margin-top:4px;">Entrar</button>
      </form>
      ${state.loginMode==="morador" ? `<p class="soft" style="font-size:11px;margin-top:14px;text-align:center;">Primeiro acesso: entre com a senha igual ao número do apto (ex.: apto 101 → senha 101). Na sequência você cadastra e-mail e uma senha só sua.</p>` : ""}
    </div>
  </div>`;
}

function renderDefinirSenha() {
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
    <div style="margin-bottom:24px;display:flex;flex-direction:column;align-items:center;">
      ${SNAIL_SVG(56)}
      <h1 class="serif" style="font-size:20px;font-weight:700;margin:10px 0 2px;">Primeiro acesso</h1>
      <p class="soft" style="font-size:13px;margin:0;text-align:center;">Apto ${esc(state.pendingApto)} — cadastre seu e-mail e uma senha só sua</p>
    </div>
    <div class="card" style="width:100%;max-width:340px;">
      <form id="definir-senha-form">
        <label class="label">Seu e-mail</label>
        <input id="f-cad-email" type="email" class="input" placeholder="seuemail@exemplo.com" style="margin-bottom:10px;" required />
        <label class="label">Nova senha</label>
        <input id="f-cad-senha" type="password" class="input" placeholder="Mínimo 4 caracteres" style="margin-bottom:10px;" required />
        <label class="label">Confirmar senha</label>
        <input id="f-cad-senha2" type="password" class="input" placeholder="Repita a senha" style="margin-bottom:10px;" required />
        ${state.cadastroError ? `<p style="color:var(--red);font-size:12px;margin:0 0 8px;">${esc(state.cadastroError)}</p>` : ""}
        <button type="submit" class="btn" style="background:var(--terracotta);margin-top:4px;">
          ${state.busy ? '<span class="spin" style="width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></span>' : ""} Salvar e entrar
        </button>
      </form>
      <button data-action="cancelar-cadastro" class="soft" style="font-size:12px;margin-top:14px;width:100%;text-align:center;">← Voltar para o login</button>
    </div>
  </div>`;
}

function renderScreen() {
  switch (state.screen) {
    case "home": return renderHome();
    case "lazer": return renderLazer();
    case "anuncios": return renderAnuncios();
    case "assembleias": return renderAssembleias();
    case "boletos": return state.session.type==="morador" ? renderBoletos() : renderHome();
    case "ocorrencias": return state.session.type==="morador" ? renderOcorrencias() : renderHome();
    case "contas": return renderContas();
    case "regulamento": return renderRegulamento();
    case "painel": return state.session.type==="admin" ? renderPainel() : renderHome();
    default: return renderHome();
  }
}

function backBtn() {
  return `<button data-action="back" style="display:flex;align-items:center;gap:4px;color:var(--brownSoft);font-size:13px;margin-bottom:12px;padding:4px 0;">← Voltar</button>`;
}

function renderHome() {
  const cards = [
    { k:"lazer", label:"Área de Lazer", desc:"Agendar festas e churrasqueira", color:"#D9793B", icon:"📅" },
    { k:"anuncios", label:"Quadro de Avisos", desc:"Comunicados do condomínio", color:"#4FAE7C", icon:"📢" },
    { k:"assembleias", label:"Assembleias / Reuniões", desc:"Convocações e assembleias extraordinárias", color:"#B8622A", icon:"🏛️", novo:true },
  ];
  if (state.session.type==="morador") {
    cards.push({ k:"boletos", label:"Boletos", desc:"Baixar boleto do mês e anteriores", color:"#3B8F63", icon:"🧾", novo:true });
    cards.push({ k:"ocorrencias", label:"Ocorrências", desc:"Relatar um problema, com fotos", color:"#E4585B", icon:"⚠️", novo:true });
  }
  cards.push({ k:"contas", label:"Contas do Condomínio", desc:"Prestação de contas mensal", color:"#B8622A", icon:"💰" });
  cards.push({ k:"regulamento", label:"Regulamento", desc:"Regimento interno", color:"#3B8F63", icon:"📄" });
  if (state.session.type==="admin") cards.push({ k:"painel", label:"Painel do Síndico", desc:"Lançar taxas, avisos e boletos", color:"#4C8DFF", icon:"🛡️" });
  const who = state.session.type==="morador" ? `, apto ${esc(state.session.apto)}` : `, ${esc(state.session.user)}`;
  return `
    <h2 class="serif" style="font-size:19px;font-weight:800;margin:6px 0 2px;">Olá${who}</h2>
    <p class="soft" style="font-size:13px;margin:0 0 16px;">O que você precisa hoje?</p>
    <div class="grid2">
      ${cards.map(c => `
        <button data-action="nav" data-screen="${c.k}" class="card" style="text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;">
          ${c.novo ? `<span style="position:absolute;top:10px;right:10px;background:var(--terracotta);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;letter-spacing:.03em;">NOVO</span>` : ""}
          <div style="width:38px;height:38px;border-radius:10px;background:${c.color}22;border:1px solid ${c.color}55;display:flex;align-items:center;justify-content:center;font-size:18px;">
            ${c.icon}
          </div>
          <div>
            <div style="font-size:13px;font-weight:700;">${c.label}</div>
            <div class="soft" style="font-size:11px;margin-top:2px;">${c.desc}</div>
          </div>
        </button>
      `).join("")}
    </div>
  `;
}

function renderLazer() {
  const { y, m } = state.cal;
  const first = new Date(y, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const tKey = todayKey();
  let cells = "";
  for (let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const key = dateKey(y,m,d);
    const reserved = !!state.reservations[key];
    const isPast = key < tKey;
    const isSel = state.selectedDay === d;
    let style = "";
    if (isPast) style = "color:#565C66;";
    else if (reserved) style = "background:var(--redSoft);color:var(--red);font-weight:700;";
    else style = "background:var(--greenSoft);color:var(--greenDark);font-weight:700;";
    if (isSel) style += "outline:2px solid var(--terracotta);outline-offset:1px;";
    cells += `<button class="day" ${isPast?"disabled":""} data-action="pick-day" data-day="${d}" style="${style}">${d}</button>`;
  }

  let detail = "";
  if (state.selectedDay) {
    const key = dateKey(y, m, state.selectedDay);
    const resv = state.reservations[key];
    const podeCancel = resv && (state.session.type==="admin" || (state.session.type==="morador" && resv.apto===state.session.apto));
    detail = `<div class="card" style="margin-top:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">${state.selectedDay} de ${MONTHS[m]} de ${y}</div>
      ${resv ? `
        <p class="soft" style="font-size:14px;margin-bottom:12px;">Reservado por <strong style="color:var(--brown);">${esc(resv.nome)}</strong> (apto ${esc(resv.apto)}).</p>
        ${podeCancel ? `<button data-action="cancelar" class="btn" style="background:var(--redSoft);color:var(--red);">${state.busy?'<span class="spin" style="width:14px;height:14px;border:2px solid var(--red);border-top-color:transparent;border-radius:50%;"></span>':''} Cancelar reserva</button>`
          : `<p class="soft" style="font-size:12px;">Apenas o morador que reservou (ou o síndico) pode cancelar.</p>`}
      ` : state.session.type==="morador" ? `
        <input id="f-nome-reserva" class="input" placeholder="Nome do responsável (apto ${esc(state.session.apto)})" style="margin-bottom:8px;" />
        <button data-action="reservar" class="btn" style="background:var(--terracotta);">${state.busy?'<span class="spin" style="width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></span>':''} Reservar este dia</button>
      ` : `<p class="soft" style="font-size:14px;">Este dia está livre. Apenas moradores podem reservar.</p>`}
    </div>`;
  }

  return `
    ${backBtn()}
    <h2 class="serif" style="font-size:17px;font-weight:700;margin:6px 0 12px;">Área de Lazer</h2>
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <button data-action="cal-prev" style="padding:6px;">◀</button>
        <div style="font-weight:700;font-size:14px;">${MONTHS[m]} ${y}</div>
        <button data-action="cal-next" style="padding:6px;">▶</button>
      </div>
      <div class="calendar-grid" style="margin-bottom:4px;">${WEEKDAYS.map(w=>`<div class="weekday">${w}</div>`).join("")}</div>
      <div class="calendar-grid">${cells}</div>
      <div style="display:flex;gap:16px;margin-top:14px;font-size:11px;">
        <div><span class="legend-dot" style="background:var(--greenSoft);border:1px solid var(--green);"></span><span class="soft">Disponível</span></div>

function wireLogin() {
  document.querySelectorAll('[data-action="login-mode"]').forEach(btn => {
    btn.onclick = () => { state.loginMode = btn.dataset.mode; state.loginError=""; render(); };
  });
  const form = document.getElementById("login-form");
  form.onsubmit = (e) => {
    e.preventDefault();
    state.loginError = "";
    if (state.loginMode === "morador") {
      const apto = document.getElementById("f-apto").value;
      const senha = document.getElementById("f-senha").value;
      state._apto = apto;
      const registro = state.residents[apto];
      if (apto && registro && registro.senha === senha) {
        if (!registro.senhaDefinida) {
          // primeiro acesso: precisa cadastrar e-mail + senha própria
          state.pendingApto = apto;
        } else {
          state.session = { type: "morador", apto };
          state.screen = "home";
          try { history.replaceState({ screen: "home" }, "", "#home"); } catch (e) {}
        }
      } else {
        state.loginError = "Apto ou senha inválidos.";
      }
    } else {
      const user = document.getElementById("f-user").value;
      const senha = document.getElementById("f-senha").value;
      if (state.admins[user] === senha) {
        state.session = { type: "admin", user };
        state.screen = "home";
        try { history.replaceState({ screen: "home" }, "", "#home"); } catch (e) {}
      } else {
        state.loginError = "Usuário ou senha inválidos.";
      }
    }
    render();
  };
}

function wireDefinirSenha() {
  document.getElementById("definir-senha-form").onsubmit = async (e) => {
    e.preventDefault();
    state.cadastroError = "";
    const email = document.getElementById("f-cad-email").value.trim();
    const senha = document.getElementById("f-cad-senha").value;
    const senha2 = document.getElementById("f-cad-senha2").value;
    if (!email.includes("@") || !email.includes(".")) {
      state.cadastroError = "Informe um e-mail válido."; render(); return;
    }
    if (senha.length < 4) {
      state.cadastroError = "A senha deve ter pelo menos 4 caracteres."; render(); return;
    }
    if (senha !== senha2) {
      state.cadastroError = "As senhas não coincidem."; render(); return;
    }
    const apto = state.pendingApto;
    state.busy = true; render();
    state.residents = { ...state.residents, [apto]: { senha, email, senhaDefinida: true } };
    await setData("residents", state.residents);
    state.busy = false;
    state.session = { type: "morador", apto };
    state.pendingApto = null;
    state.screen = "home";
    try { history.replaceState({ screen: "home" }, "", "#home"); } catch (e) {}
    render();
  };
  document.querySelector('[data-action="cancelar-cadastro"]').onclick = () => {
    state.pendingApto = null;
    state.cadastroError = "";
    render();
  };
}

function wireApp() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (["login-mode"].includes(action)) return; // handled elsewhere
    el.onclick = () => handleAction(action, el.dataset);
  });
  const filtroMes = document.getElementById("f-boleto-filtro");
  if (filtroMes) filtroMes.onchange = () => { state.boletoFiltroMes = filtroMes.value; render(); };
  const boletoApto = document.getElementById("f-boleto-apto");
  if (boletoApto) boletoApto.onchange = () => { state.painelBoletoApto = boletoApto.value; render(); };
}

function goTo(screen) {
  state.screen = screen;
  state.selectedDay = null;
  try { history.pushState({ screen }, "", "#" + screen); } catch (e) {}
  render();
}

async function handleAction(action, data) {
  switch (action) {
    case "home": goTo("home"); break;
    case "nav": goTo(data.screen); break;
    case "back": try { history.back(); } catch (e) { goTo("home"); } break;
    case "logout": {
      state.session = null; state.screen = "home"; state.pendingApto = null;
      try { history.replaceState({ screen: "login" }, "", "#login"); } catch (e) {}
      render();
      break;
    }

    case "cal-prev": case "cal-next": {
      state.selectedDay = null;
      let { y, m } = state.cal;
      m += action==="cal-next" ? 1 : -1;
      if (m<0){m=11;y--;} if (m>11){m=0;y++;}
      state.cal = { y, m };
      render();
      break;
    }
    case "pick-day": state.selectedDay = Number(data.day); render(); break;
    case "reservar": {
      const { y, m } = state.cal;
      const key = dateKey(y, m, state.selectedDay);
      const nome = document.getElementById("f-nome-reserva")?.value || `Apto ${state.session.apto}`;
      state.busy = true; render();
      state.reservations = { ...state.reservations, [key]: { apto: state.session.apto, nome } };
      await setData("reservations", state.reservations);
      state.busy = false; state.selectedDay = null; render();
      break;
    }
    case "cancelar": {
      const { y, m } = state.cal;
      const key = dateKey(y, m, state.selectedDay);
      state.busy = true; render();
      const next = { ...state.reservations };
      delete next[key];
      state.reservations = next;
      await setData("reservations", state.reservations);
      state.busy = false; state.selectedDay = null; render();
      break;
    }

    case "admin-tab": state.adminTab = data.tab; state.savedTick=""; render(); break;

    case "salvar-taxas": {
      state.busy = true; render();
      const mesReferencia = document.getElementById("f-mes-ref").value;
      const valores = { ...(state.fees.valores||{}) };
      document.querySelectorAll(".fee-agua").forEach(inp => {
        valores[inp.dataset.apto] = { ...(valores[inp.dataset.apto]||{}), agua: inp.value };
      });
      document.querySelectorAll(".fee-cond").forEach(inp => {
        valores[inp.dataset.apto] = { ...(valores[inp.dataset.apto]||{}), condominio: inp.value };
      });
      state.fees = { mesReferencia, valores };
      await setData("fees", state.fees);
      state.busy = false; state.savedTick = "taxas"; render();
      setTimeout(()=>{ state.savedTick=""; render(); }, 1500);
      break;
    }

    case "publicar-aviso": {
      const titulo = document.getElementById("f-aviso-titulo").value.trim();
      const texto = document.getElementById("f-aviso-texto").value.trim();
      if (!titulo || !texto) return;
      state.busy = true; render();
      const novo = { id:String(Date.now()), titulo, texto, data:new Date().toLocaleDateString("pt-BR") };
      state.announcements = [novo, ...state.announcements];
      await setData("announcements", state.announcements);
      state.busy = false; render();
      break;
    }
    case "remover-aviso": {
      state.announcements = state.announcements.filter(a => a.id !== data.id);
      await setData("announcements", state.announcements);
      render();
      break;
    }

    case "publicar-conta": {
      const mes = document.getElementById("f-conta-mes").value.trim();
      const descricao = document.getElementById("f-conta-desc").value.trim();
      if (!mes || !descricao) return;
      state.busy = true; render();
      const novo = { id:String(Date.now()), mes, descricao };
      state.contas = [novo, ...state.contas];
      await setData("contas", state.contas);
      state.busy = false; render();
      break;
    }
    case "remover-conta": {
      state.contas = state.contas.filter(c => c.id !== data.id);
      await setData("contas", state.contas);
      render();
      break;
    }

    case "salvar-regulamento": {
      state.busy = true; render();
      state.regulamento = document.getElementById("f-regulamento").value;
      await setData("regulamento", state.regulamento);
      state.busy = false; state.savedTick = "regulamento"; render();
      setTimeout(()=>{ state.savedTick=""; render(); }, 1500);
      break;
    }

    case "publicar-assembleia": {
      const titulo = document.getElementById("f-assembleia-titulo").value.trim();
      const dataAssembleia = document.getElementById("f-assembleia-data").value.trim();
      const texto = document.getElementById("f-assembleia-texto").value.trim();
      if (!titulo || !texto) return;
      state.busy = true; render();
      const novo = { id:String(Date.now()), titulo, dataAssembleia, texto, data:new Date().toLocaleDateString("pt-BR") };
      state.assembleias = [novo, ...state.assembleias];
      await setData("assembleias", state.assembleias);
      state.busy = false; render();
      break;
    }
    case "remover-assembleia": {
      state.assembleias = state.assembleias.filter(a => a.id !== data.id);
      await setData("assembleias", state.assembleias);
      render();
      break;
    }

    case "enviar-boleto": {
      const apto = document.getElementById("f-boleto-apto").value;
      const mes = document.getElementById("f-boleto-mes").value.trim();
      const fileInput = document.getElementById("f-boleto-arquivo");
      const file = fileInput.files && fileInput.files[0];
      if (!mes || !file) { alert("Selecione o mês de referência e o arquivo do boleto."); return; }
      state.busy = true; render();
      try {
        const path = `boletos/${apto}/${Date.now()}_${file.name}`;
        const url = await uploadFile(path, file);
        const novo = { id:String(Date.now()), mes, nomeArquivo:file.name, url, path, enviadoEm: Date.now() };
        const lista = [...(state.boletos[apto] || []), novo];
        state.boletos = { ...state.boletos, [apto]: lista };
        await setData("boletos", state.boletos);
      } catch (err) {
        console.error(err);
        alert("Não foi possível enviar o boleto. Verifique se o Firebase Storage está ativado (veja o LEIA-ME).");
      }
      state.busy = false; render();
      break;
    }
    case "remover-boleto": {
      const apto = data.apto;
      state.boletos = { ...state.boletos, [apto]: (state.boletos[apto]||[]).filter(b => b.id !== data.id) };
      await setData("boletos", state.boletos);
      render();
      break;
    }

    case "enviar-ocorrencia": {
      const descricao = document.getElementById("f-ocorrencia-desc").value.trim();
      if (!descricao) return;
      const fotosInput = document.getElementById("f-ocorrencia-fotos");
      const files = fotosInput && fotosInput.files ? Array.from(fotosInput.files) : [];
      state.busy = true; render();
      try {
        const apto = state.session.apto;
        const fotos = [];
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const path = `ocorrencias/${apto}/${Date.now()}_${i}_${f.name}`;
          fotos.push(await uploadFile(path, f));
        }
        const novo = {
          id: String(Date.now()), apto, descricao, fotos,
          status: "aberta", data: new Date().toLocaleDateString("pt-BR"), criadoEm: Date.now(),
        };
        state.ocorrencias = [novo, ...state.ocorrencias];
        await setData("ocorrencias", state.ocorrencias);
        state.ocorrenciaEnviada = true;
      } catch (err) {
        console.error(err);
        alert("Não foi possível enviar a ocorrência. Verifique se o Firebase Storage está ativado (veja o LEIA-ME).");
      }
      state.busy = false; render();
      setTimeout(() => { state.ocorrenciaEnviada = false; render(); }, 5000);
      break;
    }
    case "alternar-status-ocorrencia": {
      state.ocorrencias = state.ocorrencias.map(o =>
        o.id === data.id ? { ...o, status: o.status === "resolvida" ? "aberta" : "resolvida" } : o
      );
      await setData("ocorrencias", state.ocorrencias);
      render();
      break;
    }
  }
}

/* Faz o botão/gesto "voltar" do celular navegar dentro do app em vez de
   fechar o PWA — volta para a tela anterior (ex.: da Área de Lazer pra
   Início) em vez de sair do aplicativo. */
window.addEventListener("popstate", (e) => {
  if (!state.session) return;
  const screen = (e.state && e.state.screen) || "home";
  state.screen = screen;
  state.selectedDay = null;
  render();
});

/* PWA: registra o service worker, se existir */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
